<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Noel Jeromaan projektit. Uusia projekteja on tulossa.">
    <meta name="theme-color" content="#07070b">
    <title>Projektit | Noel Jeromaa</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="projektit.css?v=20260930-2">
  </head>
  <body class="projects-page">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html">Noel Jeromaa</a>
        <nav class="site-nav" aria-label="Päänavigaatio">
          <a href="index.html">Etusivu</a>
          <a href="tietoaminusta.html">Tietoa minusta</a>
          <a href="projektit.html" aria-current="page">Projektit</a>
          <a href="yhteystiedot.html">Yhteystiedot</a>
        </nav>
      </div>
    </header>

    <main>
      <header class="page-hero">
        <div class="page-hero-inner">
          <p class="eyebrow">Noel Jeromaa</p>
          <h1 class="page-title">Projektit</h1>
        </div>
      </header>

      <!-- Lisää uusi project-browser-item, oma project-card-artikkeli ja siirrä Tulossa-kortti seuraavaan numeroon. -->
      <div class="content project-list">
        <section class="card project-browser" aria-labelledby="project-browser-title">
          <div class="project-browser-heading">
            <div>
              <p class="project-kicker">Projektit järjestyksessä</p>
              <h2 id="project-browser-title">Kaikki projektit</h2>
            </div>
            <div class="project-browser-controls" aria-label="Selaa projekteja">
              <button type="button" data-project-prev aria-label="Edellinen projekti" disabled>←</button>
              <span data-project-position aria-live="polite">01 / 01</span>
              <button type="button" data-project-next aria-label="Seuraava projekti" disabled>→</button>
            </div>
          </div>
          <div class="project-browser-track" data-project-track tabindex="0" aria-label="Projektit ja tulevat projektit">
            <div class="project-browser-item is-upcoming">
              <span class="project-browser-number">02</span>
              <strong>Seuraava projekti</strong>
              <span>Tulossa</span>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>© 2026 Noel Jeromaa</p>
        <p>Kaikki oikeudet pidätetään</p>
      </div>
    </footer>
    <script src="projektit.js?v=20260930-1" defer></script>
  </body>
</html>
